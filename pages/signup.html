<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #bb33ff, #6b24b5);
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
        }

        .title {
            margin-bottom: 20px;
            color: #333;
        }

        .input-div {
            margin: 10px 0;
            position: relative;
        }

        .input-div input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: none;
            background: #bb33ff;
            color: white;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #6b24b5;
        }

        p {
            margin-top: 10px;
            font-size: 0.9rem;
        }

        p a {
            color: #bb33ff;
            text-decoration: none;
        }

        p a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="signup-content">
            <form id="signup-form">
                <h2 class="title">Create an Account</h2>
                <div class="input-div">
                    <input type="text" id="username" placeholder="Username">
                </div>
                <div class="input-div">
                    <input type="email" id="email" placeholder="Email">
                </div>
                <div class="input-div">
                    <input type="password" id="password" placeholder="Password">
                </div>
                <div class="input-div">
                    <input type="password" id="confirm-password" placeholder="Confirm Password">
                </div>
                <button type="submit" class="btn">Sign Up</button>
                <p>Already have an account? <a href="login.html">Login</a></p>
            </form>
        </div>
    </div>


</body>

</html>
